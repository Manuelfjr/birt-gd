[metadata]
name = birt-gd
version = 0.1.50
author = Manuel Ferreira Junior
author_email = ferreira.jr.ufpb@gmail.com
license = GNU General Public License v3 (GPLv3)
license_file = LICENSE
description = BIRT is an implementation of Beta3-irt using gradient descent.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Manuelfjr/birt-gd
project_urls =
    Bug Tracker = https://github.com/Manuelfjr/birt-gd/issues
    Source Code = https://github.com/Manuelfjr/birt-gd/blob/main/src/birt/__init__.py
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
install_requires =
    numpy>=2.1.3
    tqdm>=4.67.1
    tensorflow>=2.20.0
    pandas>=2.2.3
    seaborn>=0.13.2
    matplotlib>=3.10.0
    scikit-learn>=1.6.1
python_requires = >=3.10

[options.packages.find]
where = src
exclude = 
    mc_analysis
